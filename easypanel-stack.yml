version: "3.8"

services:
  # ==========================================
  # 1. SERVIÇO BFF: Order Gateway
  # ==========================================
  order-gateway:
    build:
      context: ./order-gateway
    container_name: expresso_neves_order_gateway
    restart: unless-stopped
    # No EasyPanel, o roteamento é via Traefik/Caddy interno. Não amarre portas no host.
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - ASAAS_API_KEY=${ASAAS_API_KEY:-sandbox}
      # Ajustado para a rede do projeto expresso_neves no EasyPanel
      - REDIS_URL=redis://:f08ead003f97b11d6490@expresso_neves_redis:6379
      - DB_CONNECTION=mysql://mysql:admin@expresso_neves_mysql:3306/expresso_neves
      - JWT_SECRET=${JWT_SECRET:-super-secret-key}
      - FLEETBASE_API_URL=http://expresso_neves_api:8000
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - fleetbase_network

  # ==========================================
  # 2. CONSOLE CUSTOMIZADO (Ember Engines)
  # ==========================================
  console-custom:
    build:
      context: .
      dockerfile: console-custom/Dockerfile
    container_name: expresso_neves_console
    restart: unless-stopped
    expose:
      - "4200"
    depends_on:
      - order-gateway
    environment:
      - API_HOST=https://api.expressoneves.com.br
    networks:
      - fleetbase_network

networks:
  fleetbase_network:
    external: true
